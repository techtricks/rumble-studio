name: ytauto-cycle

# One full pipeline cycle per scheduled run — the always-on replacement for
# the Mac's launchd scheduler: discover (7 genuine publishers) → script →
# auto-approve → render (edge-tts voices) → publish to Rumble (+ short).
# Runs on GitHub's free runners, no credit card, no separate server.

on:
  schedule:
    # UTC 21:00 = 2:30 AM IST = 2-4 PM Eastern (US). Posting into the quiet
    # hours before the US evening ramp-up (67% of Rumble traffic is US,
    # prime time 7–10 PM ET) keeps the video fresh in "Latest" all prime.
    - cron: "7 21 * * *"
    # Backup slot ~6.5h later (9:00 AM IST). The CATCHUP_HOURS guard makes
    # this a no-op when the main run already finished cleanly, so a green
    # day never doubles up — but a failed/blocked morning run gets retried
    # the same day without any manual clicking.
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse only — no publishing, no LLM-render risk"
        default: false
        type: boolean

concurrency:
  group: ytauto-cycle
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # to restore the previous run's database artifact

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Fonts + system deps
        # ffmpeg is NOT on the runner image any more (2026): the render stage
        # hard-requires it. Fonts matter too: captions draw with a real
        # typeface, and the runner image ships few.
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-noto-cjk

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Browser for the Rumble uploader
        run: playwright install --with-deps chromium

      - name: Restore the state (topic bank, published status, quota ledger)
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p data
          # The DB is machine-local by design, so it travels as an artifact
          # between runs instead of living in the git history.
          art=$(gh api "repos/$REPO/actions/artifacts?name=ytauto-state&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -n "$art" ]; then
            echo "found state artifact $art"
            gh api "repos/$REPO/actions/artifacts/$art/zip" > state.zip
            unzip -o state.zip -d data/    # unzip puts ytauto.db where it lives
            rm state.zip
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: First run — seed the evergreen topic bank
        if: ${{ steps.restore.outputs.found != 'true' }}
        run: python tools/seed_history_topics.py

      - name: Repair videos that infra once blocked (dead ffmpeg runs)
        # A render failure of "ffmpeg not found" was the CI's fault, not the
        # script's: those scripts are good and re-approved instead of
        # rotting as permanent failures.
        run: |
          python - <<'PY'
          from ytauto.db import get_db
          db = get_db()
          rows = db.conn.execute(
              "select id, last_error from videos where status='failed'"
          ).fetchall()
          repaired = 0
          for r in rows:
              # CI had no YouTube credentials: the uploader flipped the row to
              # 'failed' even though the script is fine. Credentials are not
              # the video's fault — send it back for approval so the render
              # stage rebuilds it and the Rumble publisher below ships it.
              if "no valid YouTube credentials" in (r["last_error"] or ""):
                  db.set_status(r["id"], "approved")
                  db.release(r["id"], owner="youtube/repair")
                  repaired += 1
                  continue
              if "ffmpeg not found" in (r["last_error"] or ""):
                  db.set_status(r["id"], "approved")
                  db.release(r["id"], owner="youtube/repair")
                  repaired += 1
          print(f"repaired {repaired} ffmpeg-blocked videos")
          PY

      - name: Rumble session (optional secret)
        env:
          RUMBLE_COOKIES_B64: ${{ secrets.RUMBLE_COOKIES_B64 }}
        run: |
          mkdir -p secrets
          if [ -n "$RUMBLE_COOKIES_B64" ]; then
            printf '%s' "$RUMBLE_COOKIES_B64" | base64 -d > secrets/rumble_cookies.json
          else
            echo "no RUMBLE_COOKIES_B64 secret — Rumble upload will be skipped/warn"
          fi

      - name: Run the cycle
        env:
          # secrets
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'groq' }}
          RUMBLE_EMAIL: ${{ secrets.RUMBLE_EMAIL }}
          RUMBLE_PASSWORD: ${{ secrets.RUMBLE_PASSWORD }}
          RUMBLE_CHANNEL: ${{ secrets.RUMBLE_CHANNEL }}
          # non-secret config (mirrors the Mac .env)
          LANGUAGE: English
          SUBTITLE_LANGUAGES: Hindi,Bengali,French
          TARGET_AUDIENCE: "Indian history students,exam aspirants,history lovers"
          BRAND: Indian History Facts
          BRAND_URL: https://rumble.com/c/IndianHistoryOfficial
          NICHE: "indian history,ancient india,mauryan empire,ashoka,gupta empire,chola dynasty,maratha empire,shivaji,mughal empire,aurangzeb,freedom struggle,revolt of 1857,indian independence,british raj,battle,war,army,warriors,fort,fortress,siege,conquest,empire,troops,cavalry,treasure,lost city,mystery,unsolved,secret,ancient engineering,weapon,sword,kingdom,invaded,raid"
          RSS_FEEDS: "https://www.worldhistory.org/rss/,https://www.smithsonianmag.com/rss/history/,https://www.medievalists.net/feed/,https://www.thehindu.com/society/history-and-culture/feeder/default.rss,https://theconversation.com/articles.atom,https://www.sapiens.org/feed/,https://www.ancient-origins.net/feed/"
          SUBREDDITS: IndianHistory
          # gpt-oss-120b: far higher output-token/min headroom than the small
          # preview models — the script stage kept getting 429-throttled there
          # and whole cycles blew past the runner budget.
          GROQ_MODEL: openai/gpt-oss-120b
          SCRIPTS_PER_CYCLE: "1"
          # gpt-oss-120b measured ~6.5k output tokens/min without a 429 —
          # the default 1000 pacing was throttling us 6x artificially.
          LLM_OTPM: "6000"
          # The inline upload stage targets YouTube and has no CI
          # credentials — the Rumble step below is our actual publisher.
          # Without this the stage's missing-credentials errors fail the
          # cycle, and a failed cycle would skip the Rumble publish.
          UPLOADS_PER_CYCLE: "0"
          TIMEZONE: Asia/Kolkata
          AUTO_APPROVE: "1"
          ALLOW_DEGRADED: ""
          # Publish by default: scheduled runs and dry_run=false dispatches.
          # Only an explicit dry_run=true dispatch rehearses without posting.
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          # Two parallel ffmpeg renders thrash 2 shared runner cores (a 6-min
          # video took 40+ min and the second one hit the 1h timeout); render
          # one at a time and cap it below the cycle budget.
          RENDERS_PER_CYCLE: "1"
          RENDER_TIMEOUT_S: "1800"
          IMAGES_PER_VIDEO: "12"
          MIN_NICHE_SCORE: "0"
          MIN_TOTAL_SCORE: "0.20"
          # Linux has no macOS `say`; Edge-TTS neural voices took its place.
          TTS_ENGINE: edge
          # Backup-schedule failover: a backup cron never double-posts — it
          # only works when the main run missed/failed (no clean cycle in 14h).
          CATCHUP_HOURS: "14"
        run: python -m ytauto run --cycles 1

      - name: Publish to Rumble (longform + shorts rendered this cycle)
        if: always()
        # The cycle step exits 1 on honest per-item errors (a timed-out
        # render, a thin topic); those videos that did finish must still go
        # live. The uploader refuses gracefully when its media is missing.
        env:
          RUMBLE_EMAIL: ${{ secrets.RUMBLE_EMAIL }}
          RUMBLE_PASSWORD: ${{ secrets.RUMBLE_PASSWORD }}
          RUMBLE_CHANNEL: ${{ secrets.RUMBLE_CHANNEL }}
        # Cloudflare sometimes blocks runner IPs; a failed upload must not
        # void the state artifact, so this step is allowed to fail.
        continue-on-error: true
        run: python -m ytauto rumble

      - name: Channel stats (views + monetization + earnings)
        if: always()
        # A failed scrape must not void the state artifact — best effort.
        run: |-
          python tools/rumble_stats.py || echo "stats scrape failed (non-fatal)"

      - name: Report
        if: always()
        run: |
          {
            echo "## Cycle result $(date -u '+%F %T')Z"
            echo '```'
            tail -n 40 data/logs/*.log 2>/dev/null | tail -n 60 || echo "(no logs)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Merge SQLite WAL into the state DB
        if: always()
        # A cancelled/failed cycle dies mid-write and leaves its committed
        # transactions inside data/ytauto.db-wal. Without this merge the
        # artifact stores the stale main file and every next run replays the
        # same work from scratch (the exact repeat-loop we saw on Oct 19-22).
        run: python -c "import sqlite3; c = sqlite3.connect('data/ytauto.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close(); print('WAL merged — the state DB is current')"

      - name: Persist the state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytauto-state
          path: |
            data/ytauto.db
            data/rumble_stats.json
          retention-days: 90
          if-no-files-found: warn
