# Netlify configuration for the online dashboard.
# The site files themselves deploy from netlify_site/ (Actions: dashboard.yml
# -> netlify CLI). This file is what binds the edge-function login gate.

# Edge functions live in netlify/edge-functions/ (Netlify's default discovery
# path — earlier edge/ sat outside it, so the gate never shipped).

# Every URL — HTML, all.json, thumbnails — passes the gate first.
[[edge_functions]]
function = "dash_auth"
path = "/*"
